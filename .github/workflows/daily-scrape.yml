name: Daily Danbooru Scrape

on:
  schedule:
    # Every day at 4:00 AM UTC
    - cron: "0 4 * * *"
  workflow_dispatch: # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tsx
        run: npm install -g tsx

      - name: Run scraper
        run: tsx scripts/scrape-danbooru.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/videos.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Count videos
        if: steps.changes.outputs.changed == 'true'
        id: count
        run: |
          COUNT=$(node -e "console.log(require('./src/data/videos.json').length)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git commit -m "data: update videos.json (${{ steps.count.outputs.count }} videos) [skip ci]"
          git push

      - name: Trigger Coolify deploy
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            "http://${{ secrets.COOLIFY_HOST }}/api/v1/applications/${{ secrets.COOLIFY_APP_ID }}/restart"
